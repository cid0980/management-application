<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Airy Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2D4FC4}a:hover{color:#203A94}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1A1C20; font-family: 'Noto Sans', sans-serif">
<div style="flex: 1; display: flex; flex-direction: column; gap: 28px; padding: 32px 24px 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; color: #6A6F78">French Mobiles</span>
<button aria-label="Account" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #F2F3F5; color: #1A1C20; font-weight: 500">A</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #6A6F78">Taken today</span>
<span style="font-size: 44px; font-weight: 300; letter-spacing: -1px; font-variant-numeric: tabular-nums">₹18,450</span>
<span style="font-size: 14px; color: #6A6F78">6 bills · 9 on the bench · 23 phones in stock</span>
</div>
<button style="height: 52px; border: none; border-radius: 26px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 500">New sale</button>
<div style="display: flex; justify-content: space-between">
<a href="#" style="font-size: 15px; font-weight: 500; text-decoration: none">Take in repair</a>
<a href="#" style="font-size: 15px; font-weight: 500; text-decoration: none">Buy a phone</a>
<a href="#" style="font-size: 15px; font-weight: 500; text-decoration: none">Enquiry</a>
</div>
<div style="display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 13px; color: #6A6F78; letter-spacing: 0.4px">NEEDS ATTENTION</span>
<a href="#" style="display: flex; justify-content: space-between; text-decoration: none; color: #1A1C20; font-size: 16px"><span>Service overdue</span><span style="color: #B3261E; font-weight: 600">2</span></a>
<a href="#" style="display: flex; justify-content: space-between; text-decoration: none; color: #1A1C20; font-size: 16px"><span>Ready for pickup</span><span style="font-weight: 600">4</span></a>
<a href="#" style="display: flex; justify-content: space-between; text-decoration: none; color: #1A1C20; font-size: 16px"><span>Due payments</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">₹6,200</span></a>
</div>
</div>
<nav style="height: 64px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #FFFFFF">
<a href="#" style="text-align: center; font-size: 12px; font-weight: 600; color: {{accent}}; text-decoration: none">Home</a>
<a href="#" style="text-align: center; font-size: 12px; color: #6A6F78; text-decoration: none">Mobiles</a>
<a href="#" aria-label="Scan" style="justify-self: center; width: 48px; height: 48px; border-radius: 24px; background: #F2F3F5; color: #1A1C20; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/></svg></a>
<a href="#" style="text-align: center; font-size: 12px; color: #6A6F78; text-decoration: none">Service</a>
<a href="#" style="text-align: center; font-size: 12px; color: #6A6F78; text-decoration: none">More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2D4FC4","options":["#2D4FC4","#0F766E","#1A1C20"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2D4FC4' };
}
}
</script>
</body>
</html>
