<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Airy Mobiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2D4FC4}a:hover{color:#203A94}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1A1C20; font-family: 'Noto Sans', sans-serif">
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 32px 24px 16px; overflow: hidden; position: relative">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; font-weight: 500">Mobiles</h1>
<span style="font-size: 14px; color: #6A6F78">23 in stock, worth ₹2.86L</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; background: #F2F3F5; border-radius: 23px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A6F78" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input placeholder="Search brand, model, IMEI, label" aria-label="Search phones" style="flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #1A1C20">
</label>
<div style="display: flex; gap: 22px; font-size: 15px">
<a href="#" style="text-decoration: none; color: #1A1C20; font-weight: 600; padding-bottom: 6px; border-bottom: 2px solid {{accent}}">In stock</a>
<a href="#" style="text-decoration: none; color: #6A6F78">Repairing 3</a>
<a href="#" style="text-decoration: none; color: #6A6F78">Sold</a>
</div>
<div style="display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="5">
<a href="#" style="display: flex; justify-content: space-between; align-items: flex-start; text-decoration: none; color: #1A1C20">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">{{p.model}}</span><span style="font-size: 13px; color: #6A6F78">Grade {{p.grade}} · {{p.spec}} · #{{p.label}}</span></span>
<span style="font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums">{{p.price}}</span>
</a>
</sc-for>
</div>
<button style="position: absolute; right: 24px; bottom: 16px; height: 48px; padding: 0 22px; border: none; border-radius: 24px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 500">Take in</button>
</div>
<nav style="height: 64px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #FFFFFF">
<a href="#" style="text-align: center; font-size: 12px; color: #6A6F78; text-decoration: none">Home</a>
<a href="#" style="text-align: center; font-size: 12px; font-weight: 600; color: {{accent}}; text-decoration: none">Mobiles</a>
<a href="#" aria-label="Scan" style="justify-self: center; width: 48px; height: 48px; border-radius: 24px; background: #F2F3F5; color: #1A1C20; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/></svg></a>
<a href="#" style="text-align: center; font-size: 12px; color: #6A6F78; text-decoration: none">Service</a>
<a href="#" style="text-align: center; font-size: 12px; color: #6A6F78; text-decoration: none">More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2D4FC4","options":["#2D4FC4","#0F766E","#1A1C20"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#2D4FC4',
phones: [
{ grade: 'A', model: 'iPhone 13 128GB', spec: 'Blue', label: '26014', price: '₹38,500' },
{ grade: 'B', model: 'Galaxy S21 FE', spec: '8/128', label: '26011', price: '₹17,900' },
{ grade: 'A', model: 'Redmi Note 13 Pro', spec: '8/256', label: '26009', price: '₹16,200' },
{ grade: 'C', model: 'OnePlus Nord CE 3', spec: '8/128', label: '26006', price: '₹11,000' },
{ grade: 'B', model: 'Vivo V27', spec: '8/128', label: '26003', price: '₹13,500' }
]
};
}
}
</script>
</body>
</html>
