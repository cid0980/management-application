# Builds the Android app on every push to main, and on demand from the
# Actions tab ("Run workflow"). The APK is attached to the run as an
# artifact: open the run on GitHub, scroll to Artifacts, download, install.
#
# Signing: without the secrets below, the APK is signed with the debug key —
# fine for installing on the shop's phones to test, not for the Play Store.
# For a Play Store build add these repository secrets (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# and, for photo upload, the repository variables CLOUDINARY_CLOUD_NAME and
# CLOUDINARY_UPLOAD_PRESET (Variables tab, not Secrets: they are not secret).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # The version the app is developed and tested on.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Signing key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}
          --dart-define=CLOUDINARY_UPLOAD_PRESET=${{ vars.CLOUDINARY_UPLOAD_PRESET }}

      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          cp build/app/outputs/flutter-apk/app-release.apk \
             "shop-manager-$version-run${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shop-manager-apk-run${{ github.run_number }}
          path: shop-manager-*.apk
          retention-days: 30
