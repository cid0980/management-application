# Builds the Android app on every push to main, and on demand from the
# Actions tab ("Run workflow"). The APK is attached to the run as an
# artifact: open the run on GitHub, scroll to Artifacts, download, install.
#
# Signing: without the secrets below, the APK is signed with the debug key —
# fine for installing on the shop's phones to test, not for the Play Store.
# For a Play Store build add these repository secrets (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Photos go to the shop's private Firebase Storage (shop_photos.dart); the
# build needs nothing for them.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # actions: write lets the last step delete old APK zips.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Keeps Gradle's downloads between builds: fewer requests to Maven
          # Central, which answers a busy runner with "429 Too Many
          # Requests" and fails the build (it did on run 39).
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # The version the app is developed and tested on.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Signing key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Phones only: 64-bit and older 32-bit ARM. x86_64 is for computer
      # emulators and was a third of the download for nobody's phone.
      # The run number is the build number: Settings shows "Build 65", and
      # Android sees each APK as newer than the last.
      - name: Build APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=APP_VERSION=$version

      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          cp build/app/outputs/flutter-apk/app-release.apk \
             "shop-manager-$version-run${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shop-manager-apk-run${{ github.run_number }}
          path: shop-manager-*.apk
          retention-days: 14

      # The free plan's artifact storage is small (500 MB on GitHub Free) and
      # each APK zip is tens of MB. Once the new APK is up, the older ones are
      # deleted: only the newest two stay (this one, and the one before in
      # case this one turns out bad). Anything missed expires after 14 days.
      - name: Delete old APK zips (keep the newest 2)
        uses: actions/github-script@v7
        with:
          script: |
            const all = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const apks = all
              .filter((a) => a.name.startsWith('shop-manager-apk-') && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const old of apks.slice(2)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: old.id,
              });
              core.info(`Deleted ${old.name} (${Math.round(old.size_in_bytes / 1e6)} MB)`);
            }
            core.info(`Kept: ${apks.slice(0, 2).map((a) => a.name).join(', ')}`);
